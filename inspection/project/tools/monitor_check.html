<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>CATIA · 检查实时监控</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1120;color:#e2e8f0;font:14px 'Microsoft YaHei',sans-serif}header{padding:22px 28px;border-bottom:1px solid #263248;display:flex;justify-content:space-between}h1{font-size:22px;margin:0}small,.muted{color:#94a3b8}button{background:#2563eb;color:white;border:0;padding:10px 16px;border-radius:7px;cursor:pointer}button:disabled{opacity:.5}main{padding:22px;display:grid;grid-template-columns:2fr 1fr;gap:18px}.card{border:1px solid #263248;background:#111b2e;border-radius:12px;padding:18px}.stats{grid-column:1/-1;display:flex;gap:35px}.stats strong{display:block;font-size:25px;margin-top:6px}.bar{height:6px;background:#25324a;margin:12px 0;border-radius:4px}.bar i{display:block;background:#38bdf8;height:100%;width:0}canvas{width:100%;height:490px;background:#0a1426;border-radius:8px}.phases{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}.phase{padding:7px;background:#1e293b;border-radius:6px}.phase.active{background:#1d4ed8}.log{height:350px;overflow:auto;font:12px Consolas,monospace}.entry{padding:9px 0;border-bottom:1px solid #243047;word-break:break-all}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #263248;text-align:left}tr{cursor:pointer}.wide{grid-column:1/-1}#operation{line-height:1.7;margin-bottom:15px}select{background:#1e293b;color:white;padding:8px;border:1px solid #475569} @media(max-width:900px){main{grid-template-columns:1fr}.stats{flex-wrap:wrap}}
</style><header><div><h1>CATIA 检查实时监控</h1><small>本机运行 · OCCT 精确计算 · 三维网格仅用于显示</small></div><label>计算并发 <input id="workers" type="number" min="1" max="32" value="8" style="width:55px"></label> <label>预算（分钟）<input id="budget" type="number" min="1" max="240" value="60" style="width:55px"></label> <button id="start">开始 / 续跑</button></header><main>
<section class="card stats"><div>运行状态<strong id="status">待启动</strong></div><div>已用时间<strong id="elapsed">0 秒</strong></div><div>导出批次<strong id="batch">—</strong></div><div>已完成对象对<strong id="pairs">0</strong></div><div>超时 / 失败<strong id="errors">0 / 0</strong></div></section>
<section class="card"><div class="phases" id="phases"></div><div class="bar"><i id="progress"></i></div><div id="operation">等待检查任务启动</div><canvas id="view"></canvas><p class="muted">拖动旋转 · 滚轮缩放 · 点击结果高亮对象对 <select id="objects"><option value="">全部实体</option></select></p><div id="previewNote" class="muted">几何加载后生成 OCCT 三角显示预览</div></section>
<aside class="card"><h3>模型操作与实时事件</h3><p class="muted">源模型保存状态以执行结果核验为准</p><div class="log" id="log"></div></aside><section class="card wide"><h3>检查结果 <small id="resultpath"></small></h3><div style="max-height:350px;overflow:auto"><table><thead><tr><th>状态</th><th>对象 A</th><th>对象 B</th><th>实测值</th></tr></thead><tbody id="results"></tbody></table></div></section></main>
<script>
const base=location.pathname.replace(/\/$/,''),$=id=>document.getElementById(id),labels=['模型确认','临时导出','几何加载','候选筛选','精确计算','结果核验'];let mesh=null,selected=[],yaw=.6,pitch=.4,zoom=1,drag=null,previewLoaded=false;
labels.forEach(t=>{let e=document.createElement('span');e.className='phase';e.textContent=t;$('phases').append(e)});
$('start').onclick=async()=>{let r=await fetch(base+'/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workers:Number($('workers').value),budget_minutes:Number($('budget').value)})}),v=await r.json();if(!r.ok)alert(v.error);poll()};
const canvas=$('view'),gl=canvas.getContext('webgl',{antialias:true}),buffers=new Map();let program,position,rotation,scale,color;
if(gl){function shader(type,source){let s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec3 position; uniform mat3 rotation; uniform vec3 scale; varying float shade; void main(){vec3 p=rotation*position;gl_Position=vec4(p*scale,1.0);shade=.80+.20*sin(position.x*8.0+position.y*7.0+position.z*6.0);}'));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float;uniform vec3 color;varying float shade;void main(){gl_FragColor=vec4(color*shade,1.0);}'));gl.linkProgram(program);gl.useProgram(program);position=gl.getAttribLocation(program,'position');rotation=gl.getUniformLocation(program,'rotation');scale=gl.getUniformLocation(program,'scale');color=gl.getUniformLocation(program,'color');gl.enable(gl.DEPTH_TEST);gl.enableVertexAttribArray(position)}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-drag[0])*.008;pitch+=(e.clientY-drag[1])*.008;drag=[e.clientX,e.clientY];draw()}};canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.1,Math.min(10,zoom*Math.exp(-e.deltaY*.001)));draw()};
function draw(){if(!gl){$('previewNote').textContent='当前浏览器不支持 WebGL，请开启硬件加速后刷新';return}canvas.width=canvas.clientWidth*devicePixelRatio;canvas.height=canvas.clientHeight*devicePixelRatio;gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.03,.06,.11,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);if(!mesh)return;let b=mesh.bounds,c=b.min.map((x,i)=>(x+b.max[i])/2),span=Math.hypot(...b.max.map((x,i)=>x-b.min[i]))||1,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),size=Math.min(canvas.width,canvas.height);gl.uniformMatrix3fv(rotation,false,new Float32Array([cy,-sy*sp,-sy*cp,0,cp,-sp,-sy,-cy*sp,-cy*cp]));gl.uniform3f(scale,1.6*size/canvas.width*zoom,1.6*size/canvas.height*zoom,.5);for(let o of mesh.objects){let buffer=buffers.get(o.id);if(!buffer){buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);let data=new Float32Array(o.vertices.length);for(let i=0;i<data.length;i++)data[i]=(o.vertices[i]-c[i%3])/span;gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);buffers.set(o.id,buffer)}gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.vertexAttribPointer(position,3,gl.FLOAT,false,0,0);let highlight=selected.includes(o.id);gl.uniform3fv(color,highlight?[.98,.57,.24]:selected.length?[.20,.28,.40]:[.38,.65,.98]);gl.drawArrays(gl.TRIANGLES,0,o.vertices.length/3)}}
$('objects').onchange=()=>{selected=$('objects').value?[$('objects').value]:[];draw()};window.onresize=draw;
async function poll(){try{let r=await fetch(base+'/state'),s=await r.json(),events=s.events||[],last=events.at(-1)||{},completions=events.filter(e=>/EXACT_PAIR_.*_COMPLETE/.test(e.stage)),batch=events.filter(e=>e.stage==='CATIA_BATCH_EXPORT_COMPLETE').at(-1),total=events.findLast(e=>e.total)?.total||0;$('status').textContent=({READY:'待启动',RUNNING:'运行中',COMPLETE:'已完成',ERROR:'异常'})[s.status]||s.status;if(s.status==='COMPLETE'&&s.resume?.needs_resume)$('status').textContent='本轮结束 · 待续跑';$('start').disabled=s.status==='RUNNING';$('workers').disabled=s.status==='RUNNING';$('budget').disabled=s.status==='RUNNING';$('elapsed').textContent=Math.floor(s.elapsed_seconds/60)+' 分 '+s.elapsed_seconds%60+' 秒';$('batch').textContent=batch?batch.batch_number+' 批':'—';$('pairs').textContent=s.resume?.completed_pairs??s.totals?.completed??0;$('errors').textContent=(s.resume?.timeout_pairs??s.totals?.timeouts??0)+' / '+(s.resume?.failed_pairs??s.totals?.errors??0);let stage=last.stage||'',phase=stage.includes('EXPORT')?1:stage.includes('LOAD')?2:stage.includes('CHECKPOINT')?3:stage.includes('EXACT')?4:stage==='RUN_END'?5:0;[...$('phases').children].forEach((e,i)=>e.classList.toggle('active',i===phase));$('progress').style.width=(s.resume?.completion_percent??(total?Math.min(100,100*(s.totals?.attempts||0)/total):0))+'%';$('operation').textContent=(s.status==='COMPLETE'?(s.resume?.needs_resume?'本轮结束，剩余候选待续跑':'检查已完成'):(last.operation||stage))+(last.object_a?'：'+last.object_a+' ↔ '+last.object_b:'');if(last.object_a){selected=[last.object_a,last.object_b];draw()}$('log').replaceChildren(...events.slice(-100).reverse().map(e=>{let n=document.createElement('div');n.className='entry';n.textContent=e.time+' '+JSON.stringify(e);return n}));$('resultpath').textContent=s.result_path||'';if(s.findings){$('results').replaceChildren(...s.findings.map(f=>{let tr=document.createElement('tr');for(let v of [f.status,f.object_a,f.object_b,(f.measured_value??'')+' '+(f.unit||'')]){let td=document.createElement('td');td.textContent=v;tr.append(td)}tr.onclick=()=>{selected=[f.metadata?.geometry_object_a,f.metadata?.geometry_object_b];draw()};return tr}))}if(s.preview_ready&&!previewLoaded){mesh=await(await fetch(base+'/preview')).json();previewLoaded=true;for(let o of mesh.objects){let option=document.createElement('option');option.value=o.id;option.textContent=o.name||o.id;$('objects').append(option)}$('previewNote').textContent=mesh.objects.length+' 个缓存实体 · '+mesh.triangle_count+' 个三角面 · '+(mesh.truncated?'预览有截断':'缓存实体全部显示');draw()}}catch(e){$('operation').textContent='连接监控服务失败：'+e.message}}
setInterval(poll,1500);poll();
</script></html>
